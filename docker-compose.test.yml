services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: integration
      POSTGRES_DB: estacoes_test
    ports:
      - "127.0.0.1::5432"
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration -d estacoes_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  gestao-estacoes:
    build:
      context: ./services/gestao-estacoes
      target: build
    command: ["npm", "start"]
    environment:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://integration:integration@postgres:5432/estacoes_test
      JWT_SECRET: integration-only-secret
    ports:
      - "127.0.0.1::3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  test-postgres-data:

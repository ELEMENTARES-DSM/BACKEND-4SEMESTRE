# Gateway do S1. Usado como template: o nginx troca só ${S2_HOST} (vem do .env do S1).
server {
    listen 80;
    server_name _;

    # Cabeçalhos definidos uma vez e herdados por todos os locations
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Raiz: frontend (tela de login)
    location / {
        proxy_pass http://frontend:80;
    }

    # Documentação das APIs
    location = /docs {
        return 308 /docs/;
    }

    location /docs/ {
        proxy_pass http://swagger-ui:8080/;
    }

    # Serviços do S1
    location /auth      { proxy_pass http://auth-service:3000; }
    location /usuarios  { proxy_pass http://gestao-usuarios:3000; }
    location /estacoes  { proxy_pass http://gestao-estacoes:3000; }
    location /analise   { proxy_pass http://analise-dados:3000; }
    location /relatorios { proxy_pass http://servico-relatorios:3000; }

    # Serviços do S2 (pela rede privada)
    location /alertas   { proxy_pass http://${S2_HOST}:3001; }
    location /ingestao  { proxy_pass http://${S2_HOST}:3002; }
    location /validacao { proxy_pass http://${S2_HOST}:3003; }
}

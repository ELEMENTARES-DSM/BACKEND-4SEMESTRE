name: Deploy

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

# Evita dois deploys ao mesmo tempo
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - alertas-notificacoes
          - analise-dados
          - auth-service
          - gestao-usuarios
          - gestao-estacoes
          - ingestao-dados
          - servico-relatorios
          - servico-validacao

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USER }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 1º: banco (os outros dependem dele)
  deploy-s3:
    needs: build-and-push
    runs-on: [self-hosted, s3]
    env:
      COMPOSE_PROJECT_NAME: s3
    steps:
      - uses: actions/checkout@v4

      # Sem "pull": não queremos atualizar a imagem do Postgres sem querer
      - name: Up S3 (banco)
        run: docker compose --env-file /opt/projeto/.env -f docker-compose.s3.yml up -d --remove-orphans

  # 2º: recepção de dados
  deploy-s2:
    needs: deploy-s3
    runs-on: [self-hosted, s2]
    env:
      COMPOSE_PROJECT_NAME: s2
      VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull & up S2 (recepção de dados)
        run: |
          docker compose --env-file /opt/projeto/.env -f docker-compose.s2.yml pull
          docker compose --env-file /opt/projeto/.env -f docker-compose.s2.yml up -d --remove-orphans
          docker image prune -af --filter "until=72h"

  # 3º: aplicação (usuários)
  deploy-s1:
    needs: deploy-s2
    runs-on: [self-hosted, s1]
    env:
      COMPOSE_PROJECT_NAME: s1
      VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull & up S1 (aplicação)
        run: |
          docker compose --env-file /opt/projeto/.env -f docker-compose.s1.yml pull

      - name: Run database migrations
        run: docker compose --env-file /opt/projeto/.env -f docker-compose.s1.yml run --rm gestao-usuarios npm run migrate up

      - name: Up S1 (aplicação)
        run: |
          docker compose --env-file /opt/projeto/.env -f docker-compose.s1.yml up -d --remove-orphans
          docker image prune -af --filter "until=72h"

      - name: Smoke test
        run: curl -fsS --retry 15 --retry-delay 2 --retry-connrefused http://localhost/auth/health
name: Firmware ESP32 (PlatformIO)

on:
  push:
    branches: ["develop", "main"]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

jobs:
  build-firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Fazer o Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache do PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Instalar PlatformIO
        run: pip install --upgrade platformio

      - name: Compilar firmware ESP32
        run: pio run -d firmware

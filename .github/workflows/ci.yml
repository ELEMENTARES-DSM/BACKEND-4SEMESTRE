name: CI Elementares

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

jobs:
  validacao-codigo:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - alertas-notificacoes
          - analise-dados
          - auth-service
          - gestao-usuarios
          - gestao-estacoes
          - ingestao-dados
          - servico-relatorios
          - servico-validacao
          - simulador-estacoes

    defaults:
      run:
        working-directory: ./services/${{ matrix.service }}

    steps:
      - name: Fazer o Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.0.4
        with:
          node-version: "24.x"

      - name: Instalar dependências (${{ matrix.service }})
        run: npm ci

      - name: Criar arquivo .env dinamicamente
        env:
          PORT: ${{ secrets.PORT }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
        run: |
          echo "PORT=$PORT" >> .env
          echo "DB_HOST=$DB_HOST" >> .env
          echo "DB_USER=$DB_USER" >> .env
          echo "DB_PASS=$DB_PASS" >> .env
          echo "JWT_SECRET=$JWT_SECRET" >> .env
          echo "RABBITMQ_URL=$RABBITMQ_URL" >> .env

      - name: Verificar tipagem TypeScript (${{ matrix.service }})
        run: npx tsc --noEmit

      - name: Rodar Linter (${{ matrix.service }})
        run: npm run lint --if-present

      - name: Rodar Testes (${{ matrix.service }})
        run: npm test --if-present

      - name: Fazer o Build (${{ matrix.service }})
        run: npm run build --if-present

      - name: 📢 Pull Requests
        if: always() && github.event_name == 'pull_request'
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_PRS }}
          status: ${{ job.status }}
          title: "Status do PR: ${{ matrix.service }}"
          description: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }} no serviço ${{ matrix.service }}"

      - name: 📢 Atualizações do Repositório
        if: always() && github.event_name == 'push'
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_FEED }}
          status: ${{ job.status }}
          title: "Atualização no Repositório: ${{ matrix.service }}"
          description: "A branch ${{ github.ref_name }} recebeu um novo push e a validação do serviço ${{ matrix.service }} finalizou com status: ${{ job.status }}."

  testes-integracao:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: elementares_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U integration -d elementares_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      valkey:
        image: valkey/valkey:9.1.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="valkey-cli ping | grep -q PONG"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mailpit:
        image: axllent/mailpit:v1.31.6
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgresql://integration:integration@127.0.0.1:5432/elementares_test
      STAGING_TEST_DATABASE_URL: postgresql://integration:integration@127.0.0.1:5432/elementares_test
      ALERTAS_TEST_DATABASE_URL: postgresql://integration:integration@127.0.0.1:5432/elementares_test
      VALIDACAO_TEST_DATABASE_URL: postgresql://integration:integration@127.0.0.1:5432/elementares_test
      RELATORIOS_TEST_DATABASE_URL: postgresql://integration:integration@127.0.0.1:5432/elementares_test
      VALKEY_TEST_URL: redis://127.0.0.1:6379
      REDIS_URL: redis://127.0.0.1:6379
      MQTT_TEST_URL: mqtt://127.0.0.1:1883
      RABBITMQ_TEST_URL: amqp://guest:guest@127.0.0.1:5672
      SMTP_TEST_HOST: 127.0.0.1
      SMTP_TEST_PORT: "1025"
      MAILPIT_TEST_URL: http://127.0.0.1:8025
      VALKEY_PASSWORD: ci-descartavel

    steps:
      - name: Fazer o Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.0.4
        with:
          node-version: "24.x"

      - name: Subir broker MQTT (Mosquitto)
        run: |
          cp .env.example .env
          docker compose up -d --wait mosquitto

      - name: Rodar testes de integração (ingestao-dados)
        working-directory: ./services/ingestao-dados
        run: |
          npm ci
          npm run test:integration -- --verbose

      - name: Rodar testes de integração (alertas-notificacoes)
        working-directory: ./services/alertas-notificacoes
        run: |
          npm ci
          npm run test:integration -- --verbose

      - name: Rodar testes de integração (analise-dados)
        working-directory: ./services/analise-dados
        run: |
          npm ci
          npm run test:integration -- --verbose

      - name: Rodar testes de integração (gestao-usuarios)
        working-directory: ./services/gestao-usuarios
        run: |
          npm ci
          npm run test:integration -- --verbose

      - name: Rodar testes de integração (servico-relatorios)
        working-directory: ./services/servico-relatorios
        run: |
          npm ci
          npm run test:integration -- --verbose

      - name: Rodar testes de integração (servico-validacao)
        working-directory: ./services/servico-validacao
        run: |
          npm ci
          npm run test:integration -- --verbose

      - name: Rodar testes de integração (gestao-estacoes)
        run: |
          npm --prefix services/gestao-estacoes ci
          bash scripts/test-integration.sh

      - name: Logs do Mosquitto em caso de falha
        if: failure()
        run: docker compose logs mosquitto

  teste-fluxo-ingestao:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./tests/fluxo-ingestao

    steps:
      - name: Fazer o Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.0.4
        with:
          node-version: "24.x"

      - name: Instalar dependências (teste do fluxo de ingestão)
        run: npm ci

      - name: Verificar tipagem TypeScript (teste do fluxo de ingestão)
        run: npx tsc --noEmit

      - name: Rodar Linter (teste do fluxo de ingestão)
        run: npm run lint

      - name: Rodar Testes (teste do fluxo de ingestão)
        run: npm test

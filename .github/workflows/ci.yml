name: CI Elementares

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  validacao-codigo:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false 
      matrix:
        service: 
          - alertas-notificacoes
          - analise-dados
          - auth-service
          - gestao-estacoes
          - ingestao-dados
          - servico-relatorios
          - servico-validacao

    defaults:
      run:
        working-directory: ./services/${{ matrix.service }}

    steps:
    - name: Fazer o Checkout do código
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Configurar Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.0.4
      with:
        node-version: '24.x'

    - name: Instalar dependências (${{ matrix.service }})
      run: npm ci

    - name: Criar arquivo .env dinamicamente
      env:
        PORT: ${{ secrets.PORT }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
      run: |
        echo "PORT=$PORT" >> .env
        echo "DB_HOST=$DB_HOST" >> .env
        echo "DB_USER=$DB_USER" >> .env
        echo "DB_PASS=$DB_PASS" >> .env
        echo "JWT_SECRET=$JWT_SECRET" >> .env
        echo "RABBITMQ_URL=$RABBITMQ_URL" >> .env

    - name: Verificar tipagem TypeScript (${{ matrix.service }})
      run: npx tsc --noEmit

    - name: Rodar Linter (${{ matrix.service }})
      run: npm run lint --if-present

    - name: Rodar Testes (${{ matrix.service }})
      run: npm test --if-present

    - name: Fazer o Build (${{ matrix.service }})
      run: npm run build --if-present
    
    - name: 📢 Pull Requests
      if: always() && github.event_name == 'pull_request'
    - uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK_PRS }}
        status: ${{ job.status }}
        title: "Status do PR: ${{ matrix.service }}"
        description: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }} no serviço ${{ matrix.service }}"

    - name: 📢 Atualizações do Repositório
      if: always() && github.event_name == 'push'
    - uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK_FEED }}
        status: ${{ job.status }}
        title: "Atualização no Repositório: ${{ matrix.service }}"
        description: "A branch ${{ github.ref_name }} recebeu um novo push e a validação do serviço ${{ matrix.service }} finalizou com status: ${{ job.status }}."

  sonarcloud:
    name: Analise SonarCloud
    runs-on: ubuntu-latest
    needs: validacao-codigo
    steps:
      - name: Fazer o Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # master (2025-08-27)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=elementares-dsm-backend
            -Dsonar.projectKey=elementares-dsm-backend_backend-4-semestre
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}

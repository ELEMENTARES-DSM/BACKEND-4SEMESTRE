name: CI Elementares

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  validacao-codigo:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false 
      matrix:
        service: 
          - alertas-notificacoes
          - analise-dados
          - auth-service
          - gestao-estacoes
          - ingestao-dados
          - servico-relatorios
          - servico-validacao

    defaults:
      run:
        working-directory: ./services/${{ matrix.service }}

    steps:
    - name: Fazer o Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'

    - name: Instalar dependências (${{ matrix.service }})
      run: npm ci

    - name: Verificar tipagem TypeScript (${{ matrix.service }})
      run: npx tsc --noEmit

    - name: Rodar Linter (${{ matrix.service }})
      run: npm run lint --if-present

    - name: Rodar Testes (${{ matrix.service }})
      run: npm test --if-present

    - name: Fazer o Build (${{ matrix.service }})
      run: npm run build --if-present

  sonarcloud:
    name: Analise SonarCloud
    runs-on: ubuntu-latest
    needs: validacao-codigo
    steps:
      - name: Fazer o Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=elementares-dsm-backend
            -Dsonar.projectKey=elementares-dsm-backend_backend-4-semestre
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
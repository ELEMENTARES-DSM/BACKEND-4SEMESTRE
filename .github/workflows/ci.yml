name: CI Elementares

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  validacao-codigo:
    runs-on: ubuntu-latest

    steps:
    - name: Fazer o Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x' 
        cache: 'npm' 

    - name: Instalar dependências
      run: npm ci

    - name: Verificar tipagem (TypeScript)
      run: npx tsc --noEmit

    - name: Rodar Linter 
      run: npm run lint --if-present

    - name: Rodar Testes
      run: npm test --if-present

    - name: Fazer o Build
      run: npm run build --if-present
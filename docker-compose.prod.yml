services:
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.32.15
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      URLS: >-
        [
          {"url": "/auth/openapi.json", "name": "Autenticação"},
          {"url": "/alertas/openapi.json", "name": "Alertas e notificações"},
          {"url": "/analise/openapi.json", "name": "Análise de dados"},
          {"url": "/estacoes/openapi.json", "name": "Gestão de estações"},
          {"url": "/ingestao/openapi.json", "name": "Ingestão de dados"},
          {"url": "/relatorios/openapi.json", "name": "Relatórios"},
          {"url": "/validacao/openapi.json", "name": "Validação"},
          {"url": "/usuarios/openapi.json", "name": "Usuários"}
        ]
      URLS_PRIMARY_NAME: Autenticação
      DOC_EXPANSION: list
      FILTER: "true"
      DEEP_LINKING: "true"
      DISPLAY_REQUEST_DURATION: "true"
      VALIDATOR_URL: none
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - swagger-ui
      - frontend
      - auth-service
      - alertas-notificacoes
      - analise-dados
      - gestao-usuarios
      - gestao-estacoes
      - ingestao-dados
      - servico-relatorios
      - servico-validacao
    networks:
      - app-network

  frontend:
    image: ${DOCKERHUB_USER}/frontend:latest
    restart: unless-stopped
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    image: ${DOCKERHUB_USER}/auth-service:latest
    restart: unless-stopped
    environment:
      PUBLIC_API_URL: /auth
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  alertas-notificacoes:
    image: ${DOCKERHUB_USER}/alertas-notificacoes:latest
    restart: unless-stopped
    environment:
      PUBLIC_API_URL: /alertas
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  analise-dados:

      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  servico-validacao:
    image: ${DOCKERHUB_USER}/servico-validacao:latest
    restart: unless-stopped
    environment:

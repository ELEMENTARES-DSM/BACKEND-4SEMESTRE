global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # 1) Disponibilidade: o /health de cada microsserviço, passando pelo nginx (igual ao usuário)
  - job_name: health-servicos
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://nginx/auth/health
          - http://nginx/usuarios/health
          - http://nginx/alertas/health
          - http://nginx/analise/health
          - http://nginx/estacoes/health
          - http://nginx/ingestao/health
          - http://nginx/relatorios/health
          - http://nginx/validacao/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        regex: http://nginx/([^/]+)/health
        target_label: servico
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # 2) Infraestrutura que não tem HTTP: porta TCP aberta = no ar
  - job_name: portas-infra
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["postgres:5432", "valkey:6379", "rabbitmq:5672", "mosquitto:1883"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        regex: ([^:]+):.*
        target_label: servico
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # 3) Métricas internas de cada componente
  - job_name: rabbitmq          # plugin rabbitmq_prometheus já vem ligado na imagem
    static_configs: [{ targets: ["rabbitmq:15692"] }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"] }]
  - job_name: containers
    static_configs: [{ targets: ["cadvisor:8080"] }]
  - job_name: maquina
    static_configs: [{ targets: ["node-exporter:9100"] }]

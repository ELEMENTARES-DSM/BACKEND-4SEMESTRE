# Tópico de telemetria: pulso/estacoes/<uuid>/telemetria.
# O usuário MQTT de cada estação é o próprio UUID da estação.

# Estação: publica somente na própria telemetria. %u é o usuário autenticado.
pattern write pulso/estacoes/%u/telemetria

# Ingestão: lê a telemetria de todas as estações.
user ingestao-dados
topic read pulso/estacoes/+/telemetria

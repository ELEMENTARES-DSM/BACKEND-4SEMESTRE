per_listener_settings true

# Interno, só na rede Docker
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# Externo: TLS, certificado de cliente por estação, usuário/senha e ACL
listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# TLS 1.2 é o mínimo aceito pela maioria dos módulos IoT
tls_version tlsv1.2
require_certificate true
# O usuário vem da senha MQTT, não do CN do certificado
use_identity_as_username false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# Healthcheck do docker-compose (loopback do container)
listener 1884 127.0.0.1
protocol mqtt
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 60

# Sessões com clean_session=false expiram após 30 dias offline
persistent_client_expiration 30d

max_connections -1
max_queued_messages 20000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe

# US-29: a estação conecta sem usuário, senha ou certificado e se identifica
# pelo MAC no clientId e no tópico pulso/estacoes/<mac>/telemetria.
# Sem senha e sem ACL: a porta 1883 deve ficar só na rede da Prefeitura.
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 60

# Sessões com clean_session=false expiram após 30 dias offline
persistent_client_expiration 30d

max_connections -1
max_queued_messages 20000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe

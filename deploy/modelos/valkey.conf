# Valkey do Pulso Urbano (${VALKEY_INSTANCIA}). Gerado pelo instalador; não edite aqui.
bind ${VALKEY_BIND}
port ${VALKEY_PORTA}
protected-mode yes
requirepass ${VALKEY_SENHA}

dir ${VALKEY_DIR}
# Cada escrita vai para o disco antes de responder: um reinício não perde
# token revogado (S1) nem leitura em staging (S2).
appendonly yes
appendfsync always

# Cheio, recusa escrita em vez de apagar chaves: perder leitura é pior.
maxmemory ${VALKEY_MAXMEMORY}
maxmemory-policy noeviction

tcp-keepalive 300
loglevel notice
logfile ""

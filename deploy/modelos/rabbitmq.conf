# RabbitMQ do Pulso Urbano (S2). Gerado pelo instalador; não edite aqui.
# Só os serviços do próprio S2 usam a fila: escuta apenas na máquina.
listeners.tcp.local = 127.0.0.1:5672

# Acima desta fração da memória da máquina, o RabbitMQ recusa mensagens novas
# (arquitetura física, seção 6). O alerta do S4 dispara antes, em 35%.
vm_memory_high_watermark.relative = ${RABBITMQ_LIMITE_MEMORIA}
disk_free_limit.absolute = 2GB

loopback_users.guest = true

# Painel só pela própria máquina (túnel SSH); métricas para o Prometheus do S4.
management.tcp.ip = 127.0.0.1
management.tcp.port = 15672
prometheus.tcp.port = 15692

# Pulso Urbano · S1. Gerado pelo instalador a partir de deploy/modelos/nginx-pulso.conf.
# Não edite aqui: a próxima instalação sobrescreve.

# Serviços do próprio S1
upstream pulso_auth       { server 127.0.0.1:3001; keepalive 8; }
upstream pulso_usuarios   { server 127.0.0.1:3008; keepalive 8; }
upstream pulso_estacoes   { server 127.0.0.1:3004; keepalive 8; }
upstream pulso_analise    { server 127.0.0.1:3003; keepalive 8; }
upstream pulso_relatorios { server 127.0.0.1:3006; keepalive 8; }
# Serviços do S2 (recepção), pela rede interna
upstream pulso_alertas    { server ${S2_IP}:3002; keepalive 8; }
upstream pulso_ingestao   { server ${S2_IP}:3005; keepalive 2; }
upstream pulso_validacao  { server ${S2_IP}:3007; keepalive 2; }

# A porta 80 só manda para o HTTPS.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name ${DOMINIO} _;
    server_tokens off;

    ssl_certificate     ${CERT_ARQUIVO};
    ssl_certificate_key ${CHAVE_ARQUIVO};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:pulso_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include snippets/pulso-cabecalhos.conf;

    # Importação de medições em CSV (US-31) passa do 1 MB padrão.
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/json application/javascript application/xml image/svg+xml;

    # Site (arquivos estáticos do frontend)
    root /var/www/pulso-urbano/atual;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/pulso-cabecalhos.conf;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/pulso-cabecalhos.conf;
    }

    # A rota interna do gestao-estacoes (INTERNAL_TOKEN) não sai para a internet.
    location ^~ /api/v1/internal/ {
        return 404;
    }

    # API: o prefixo de cada rota leva ao serviço dono dela.
    location /auth       { proxy_pass http://pulso_auth;       include snippets/pulso-proxy.conf; }
    location /usuarios   { proxy_pass http://pulso_usuarios;   include snippets/pulso-proxy.conf; }
    location /estacoes   { proxy_pass http://pulso_estacoes;   include snippets/pulso-proxy.conf; }
    location /analise    { proxy_pass http://pulso_analise;    include snippets/pulso-proxy.conf; }
    location /relatorios { proxy_pass http://pulso_relatorios; include snippets/pulso-proxy.conf; }
    location /alertas    { proxy_pass http://pulso_alertas;    include snippets/pulso-proxy.conf; }
    location /ingestao   { proxy_pass http://pulso_ingestao;   include snippets/pulso-proxy.conf; }
    location /validacao  { proxy_pass http://pulso_validacao;  include snippets/pulso-proxy.conf; }
}

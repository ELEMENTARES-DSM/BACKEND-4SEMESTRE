# Mosquitto do Pulso Urbano (S2). Gerado pelo instalador; não edite aqui.
# Baseado em mosquitto/mosquitto.conf da repo (US-29): a estação conecta sem
# usuário, senha ou certificado e se identifica pelo MAC no clientId e no
# tópico pulso/estacoes/<mac>/telemetria. Por isso a 1883 só pode ser
# alcançada pela rede das estações (o firewall do S2 bloqueia o resto).
pid_file /run/mosquitto/mosquitto.pid

persistence true
persistence_location /var/lib/mosquitto/
persistence_file mosquitto.db
autosave_interval 60

# Sessões com clean_session=false expiram após 30 dias offline
persistent_client_expiration 30d

max_queued_messages 20000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

listener 1883 ${MQTT_BIND}
protocol mqtt
allow_anonymous true
max_connections -1

# PostgreSQL do Pulso Urbano (S3). Gerado pelo instalador; não edite aqui.
# Fica em conf.d/ e vale por cima do postgresql.conf do pacote.
listen_addresses = '${PG_LISTEN}'
port = 5432
max_connections = ${PG_MAX_CONNECTIONS}

# Memória: o banco usa a RAM como cache (arquitetura física, seção 7).
shared_buffers = ${PG_SHARED_BUFFERS}
effective_cache_size = ${PG_EFFECTIVE_CACHE_SIZE}
work_mem = 16MB
maintenance_work_mem = 512MB

# A 38.02 mediu que o JIT ligado dobra o tempo do IQAr.
jit = off

password_encryption = scram-sha-256
wal_compression = on
checkpoint_completion_target = 0.9

# Registra consultas lentas (acima de 1 s) para achar o que pesa no painel.
log_min_duration_statement = 1000
log_lock_waits = on
log_line_prefix = '%m [%p] %q%u@%d '

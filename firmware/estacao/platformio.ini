[platformio]
default_envs = esp32

[env:esp32]
; ^6 = Arduino-ESP32 2.x (ESP-IDF 4.4). O código de lib/conexao também compila no ESP-IDF 5.
platform = espressif32@^6.0.0
; trocar pela placa do cliente
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
; MQTT: cliente esp-mqtt (mqtt_client.h) que já vem no core Arduino; não precisa de lib_deps.
lib_deps =
  bblanchon/ArduinoJson@^7

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_deps = bblanchon/ArduinoJson@^7
upload_port = /dev/ttyACM0
; verifique em qual porta a sua placa ESP32 está conectada, depende do SO
; e insira o valor em upload_port
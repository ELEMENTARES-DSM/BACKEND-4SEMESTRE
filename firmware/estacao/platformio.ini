[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
; trocar pela placa do cliente
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
; + biblioteca MQTT escolhida na 26.01 (entra em lib_deps)
lib_deps =
  bblanchon/ArduinoJson@^7

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_deps = bblanchon/ArduinoJson@^7
